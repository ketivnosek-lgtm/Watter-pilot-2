name: Water source diagnostics
on:
  push:
    paths:
      - '.github/workflows/water-diagnostics.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official sources
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json
          urls = {
              'RWS catalog': ('https://ddapi20-waterwebservices.rijkswaterstaat.nl/METADATASERVICES/OphalenCatalogus', {'CatalogusFilter': {'Eenheden': True, 'Grootheden': True, 'Hoedanigheden': True}}),
              'ELWIS': ('https://www.elwis.de/DE/dynamisch/Wasserstaende/Pegelvorhersage%3ADUISBURG-RUHRORT', None),
              'PEGELONLINE': ('https://pegelonline.wsv.de/webservices/rest-api/v2/stations/DUISBURG-RUHRORT.json?includeTimeseries=true', None)
          }
          failures = []
          for name, (url, payload) in urls.items():
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode() if payload else None, headers={'Content-Type':'application/json','User-Agent':'WaterPilot2 diagnostics'})
                  with urllib.request.urlopen(req, timeout=40) as response:
                      body = response.read()
                      print(name, response.status, len(body), response.headers.get('Content-Type'))
                  if name == 'RWS catalog':
                      obj = json.loads(body)
                      print('Catalog keys:', list(obj))
                      for key, value in obj.items():
                          if isinstance(value, list):
                              print(key, len(value))
                              for row in value:
                                  if isinstance(row, dict) and any(s in str(row).lower() for s in ['rotterdam','hansweert','terneuzen','yerseke']):
                                      print(str(row)[:1500])
                      open('rws-catalog.json','wb').write(body)
                  else:
                      open(name.lower()+'.txt','wb').write(body)
                      print(body[:1000].decode(errors='replace'))
              except Exception as exc:
                  print(name, type(exc).__name__, str(exc))
                  failures.append(name)
          if failures:
              print('Failed initial probes:', ', '.join(failures))
          # Inspect actual forecast rows and station-specific metadata, not just HTTP status.
          from html.parser import HTMLParser
          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__(); self.row=None; self.cell=None; self.rows=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='tr': self.row=[]; self.cell=None
                  if tag in ('td','th') and self.row is not None: self.cell=[]
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(' '.join(self.cell).split())); self.cell=None
                  if tag=='tr' and self.row is not None:
                      self.rows.append(self.row); self.row=None; self.cell=None
          from pathlib import Path
          p=Rows(); p.feed(Path('elwis.txt').read_text() if Path('elwis.txt').exists() else '')
          print('ELWIS TABLE ROWS', json.dumps(p.rows, ensure_ascii=False)[:18000])
          catalog=json.load(open('rws-catalog.json')) if Path('rws-catalog.json').exists() else {'LocatieLijst': []}
          from datetime import datetime, timedelta, timezone
          now=datetime.now(timezone.utc)
          def stamp(t): return t.isoformat(timespec='milliseconds')
          codes=('hansweert','terneuzen','yerseke','rotterdam.nieuwemaas.boompjes','rotterdam.lekhaven','rotterdam.eemhaven')
          locations={l['Code'].lower():l for l in catalog.get('LocatieLijst', []) if l.get('Code')}
          observation_failures = []
          for code in codes:
              if code not in locations:
                  print('STATION NOT FOUND',code); observation_failures.append(code); continue
              loc=locations[code]
              print('STATION',json.dumps(loc,ensure_ascii=False))
              for kind, metadata, begin, end in [
                  ('measured', {'Grootheid':{'Code':'WATHTE'},'Hoedanigheid':{'Code':'NAP'},'ProcesType':'meting'},now-timedelta(hours=3),now),
                  ('extremes', {'Groepering':{'Code':'GETETBRKD2'}},now-timedelta(hours=1),now+timedelta(hours=36)),
                  ('astronomical', {'Grootheid':{'Code':'WATHTE'},'Hoedanigheid':{'Code':'NAP'},'ProcesType':'astronomisch'},now-timedelta(hours=1),now+timedelta(hours=36))]:
                  payload={'Locatie':{'Code':loc['Code']},'AquoPlusWaarnemingMetadata':{'AquoMetadata':metadata},'Periode':{'Begindatumtijd':stamp(begin),'Einddatumtijd':stamp(end)}}
                  try:
                      req=urllib.request.Request('https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenWaarnemingen',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
                      with urllib.request.urlopen(req,timeout=25) as response: data=json.load(response)
                      print('OBSERVATIONS',code,kind,json.dumps(data,ensure_ascii=False)[:6500])
                      # A nonempty outer list can still contain no usable measurements.
                      import math
                      valid = []
                      for series in data.get('WaarnemingenLijst') or []:
                          for item in series.get('MetingenLijst') or []:
                              try:
                                  value = float(item['Meetwaarde']['Waarde_Numeriek'])
                                  ts = datetime.fromisoformat(item['Tijdstip'].replace('Z','+00:00'))
                                  if math.isfinite(value) and abs(value) < 100000 and begin <= ts <= end:
                                      valid.append((ts.isoformat(), value))
                              except (KeyError, TypeError, ValueError, OverflowError):
                                  continue
                      print('VALID MEASUREMENTS', code, kind, len(valid), valid[:3])
                      if not valid:
                          observation_failures.append(code+' '+kind+' no valid values')
                      with open('rws-'+code+'-'+kind+'.json','w') as out: json.dump(data,out,ensure_ascii=False)
                  except Exception as exc:
                      print('OBSERVATION ERROR',code,kind,str(exc))
                      observation_failures.append(code+' '+kind)
          if failures or observation_failures:
              raise SystemExit('Incomplete probes: '+', '.join(failures+observation_failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-source-responses
          path: |
            rws-catalog.json
            rws-*.json
            elwis.txt
            pegelonline.txt
          if-no-files-found: warn
